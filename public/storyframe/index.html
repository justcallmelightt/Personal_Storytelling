<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>STORYFRAME으로 이동</title>
  <script>
    const path = new URLSearchParams(location.search).get('view') === 'read' ? '/story' : '/';
    location.replace(path + location.hash);
  </script>
</head>
<body><p><a href="/">STORYFRAME 열기</a></p></body>
</html>
